spring:
  application:
    name: product-server
  datasource:
    url: jdbc:postgresql://localhost:5433/product
    username: product
    password: product
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    redis:
      time-to-live: 30m
      cache-null-values: false
      use-key-prefix: true
    type: redis